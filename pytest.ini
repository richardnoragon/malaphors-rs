[pytest]
addopts = -v --tb=short --durations=10
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Use headless mode for GUI tests
qt_qpa_platform = offscreen

# Test markers
markers =
    gui: marks tests that require GUI (Qt/tkinter)
    core: marks tests for core functionality
    logging: marks tests for logging functionality
    slow: marks tests that take longer to run
    integration: marks integration tests
    unit: marks unit tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::RuntimeWarning:pytest
    error::pytest.PytestUnhandledThreadExceptionWarning

# Test selection options
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv env virtualenv